<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mapa</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <style>
        #map {
            height: 600px;
            width: 100%;
        }
    </style>
</head>

<body>

    <h1>Mapa de Georreferencias</h1>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <script>

        var map = L.map('map').setView([20, 0], 2);

        L.tileLayer(
            'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                attribution: '&copy; OpenStreetMap'
            }
        ).addTo(map);

        var puntos = [];

        {% for lugar in lugares %}

        var lat = parseFloat("{{ lugar[0] }}");
        var lon = parseFloat("{{ lugar[1] }}");

        puntos.push([lat, lon]);

        L.marker([lat, lon])
            .addTo(map)
            .bindPopup(
                '<a target="_blank" href="https://www.google.com/maps?q='
                + lat + ',' + lon +
                '">Abrir en Google Maps</a>'
            );

        {% endfor %}

        if (puntos.length > 0) {
            map.fitBounds(puntos);
        }

    </script>

</body>

</html>
